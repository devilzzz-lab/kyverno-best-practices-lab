apiVersion: v1
kind: Pod
metadata:
  name: good-pod-labeled
  labels:
    app: demo-app
    env: dev
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
