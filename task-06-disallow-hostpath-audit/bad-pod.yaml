apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-hostpath
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      volumeMounts:
        - name: host-vol
          mountPath: /host-data
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  volumes:
    - name: host-vol
      hostPath:
        path: /tmp
        type: Directory
