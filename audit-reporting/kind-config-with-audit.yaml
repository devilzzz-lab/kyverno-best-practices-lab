kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kyverno-lab
nodes:
  - role: control-plane
    extraMounts:
      # Mount the audit policy file and a host directory for the audit log output
      # into the control-plane container, so the API server can read/write them.
      - hostPath: ./audit-reporting/audit-policy.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
      - hostPath: ./audit-reporting/audit-logs
        containerPath: /var/log/kubernetes/audit
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-maxage: "7"
            audit-log-maxbackup: "3"
            audit-log-maxsize: "100"
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/policies/audit-policy.yaml
              mountPath: /etc/kubernetes/policies/audit-policy.yaml
              readOnly: true
              pathType: File
            - name: audit-logs
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              pathType: DirectoryOrCreate
