apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Log full request/response body for anything touching Pods or Deployments —
  # this is what lets us see who applied what, and whether Kyverno allowed or blocked it.
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods"]
      - group: "apps"
        resources: ["deployments"]

  # Log metadata-only (no bodies) for everything else, to keep log size sane.
  - level: Metadata
    omitStages:
      - "RequestReceived"
